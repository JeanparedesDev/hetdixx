<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#15102e">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hetdixx</title>
<link id="favicon-dinamico" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a1018'/%3E%3Ctext x='50%25' y='60%25' font-family='sans-serif' font-size='42' font-weight='bold' text-anchor='middle' fill='%23e2a84e'%3EH%3C/text%3E%3C/svg%3E">
<meta name="description" content="Todos mis links en un solo lugar">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#0a1018; --noche2:#111c27; --sakura:#e2a84e; --cielo:#65b6c4;
    --papel:#edf1f4; --luna:#f2bd65;
  }
  *{box-sizing:border-box;margin:0}
  html,body{min-height:100%}
  body{
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
    color:var(--papel);
    background:radial-gradient(120% 80% at 50% 0%,var(--noche2),var(--noche));
    padding:max(28px,env(safe-area-inset-top)) 18px max(100px,env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  /* FONDO: imagen fondo.jpg con capa oscura para que se lean los textos */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
  .bio{text-shadow:0 1px 8px rgba(0,0,0,.7)}
  .luna{position:fixed;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff6d6,var(--luna) 60%,#f3c76a);
    box-shadow:0 0 90px 30px rgba(255,226,154,.28);opacity:.9;pointer-events:none}
  #petalos{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .petalo{position:absolute;top:-30px;width:14px;height:11px;background:var(--sakura);
    border-radius:80% 0 80% 0;opacity:.85;animation:caer linear infinite}
  @keyframes caer{
    to{transform:translate(var(--dx),110vh) rotate(var(--rot))}
  }
  main{position:relative;max-width:460px;margin:0 auto;text-align:center}

  .avatar{position:relative;width:132px;height:132px;margin:8px auto 18px}
  .avatar::before{content:"";position:absolute;inset:-7px;border-radius:50%;
    background:conic-gradient(var(--sakura),var(--cielo),var(--luna),var(--sakura));
    animation:giro 8s linear infinite}
  .avatar::after{content:"";position:absolute;inset:-3px;border-radius:50%;background:var(--noche)}
  .avatar img{position:relative;z-index:1;width:100%;height:100%;border-radius:50%;object-fit:cover;
    background:linear-gradient(135deg,var(--sakura),var(--cielo));display:block}
  @keyframes giro{to{transform:rotate(360deg)}}

  h1{font-family:"Dela Gothic One","Zen Maru Gothic",sans-serif;font-weight:400;
    font-size:2.4rem;letter-spacing:.02em;text-shadow:3px 3px 0 var(--sakura)}
  .kanji{display:block;margin-top:2px;font-size:.95rem;color:var(--cielo);letter-spacing:.35em}
  .bio{margin:14px auto 28px;max-width:34ch;line-height:1.55;font-size:1.02rem;color:#ece3ff}

  .links{display:grid;gap:14px;padding:0;list-style:none}
  .links a{
    display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;
    color:var(--noche);background:var(--papel);
    border:3px solid var(--noche);border-radius:14px 4px 14px 4px;
    padding:14px 16px;box-shadow:6px 6px 0 var(--c,var(--sakura));
    transition:transform .12s ease,box-shadow .12s ease;
  }
  .links a:hover,.links a:focus-visible{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--c,var(--sakura));outline:none}
  .links a:focus-visible{outline:3px solid var(--luna);outline-offset:3px}
  .ico{flex:none;width:46px;height:46px;display:grid;place-items:center;font-size:1.5rem;
    background:var(--c,var(--sakura));border:3px solid var(--noche);border-radius:50%}
  .ico svg{width:24px;height:24px;fill:var(--noche)}
  .txt b{display:block;font-size:1.08rem}
  .txt small{display:block;font-size:.84rem;opacity:.7;margin-top:1px}

  footer{margin-top:34px;font-size:.85rem;color:#b9aedd}

  @media (prefers-reduced-motion:reduce){
    .petalo,.avatar::before{animation:none}
    .links a{transition:none}
  }

  /* ===== efecto 3D con el mouse ===== */
  .escena{perspective:900px}
  main{transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform}
  .avatar{transform:translateZ(60px)}
  h1{transform:translateZ(44px)}
  .kanji{transform:translateZ(32px)}
  .bio{transform:translateZ(20px)}
  .links{transform-style:preserve-3d}
  .links li{transform:translateZ(26px)}
  body::before{transform:translate(var(--bx,0px),var(--by,0px)) scale(1.1)}

  /* ===== música ===== */
  .entrada{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:rgba(20,16,43,.82);backdrop-filter:blur(6px);cursor:pointer;transition:opacity .5s}
  .entrada[hidden]{display:none}
  .entrada.fuera{opacity:0;pointer-events:none}
  .entrada div{text-align:center}
  .entrada .k{display:block;font-family:"Dela Gothic One",sans-serif;font-size:3.2rem;
    color:var(--sakura);text-shadow:3px 3px 0 var(--cielo)}
  .entrada b{display:block;margin-top:12px;letter-spacing:.06em;animation:pulso 1.6s ease-in-out infinite}
  @keyframes pulso{50%{opacity:.35}}
  .musica{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right));
    bottom:max(16px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;
    border:3px solid var(--noche);background:var(--papel);box-shadow:4px 4px 0 var(--sakura);
    display:grid;place-items:center;cursor:pointer}
  .musica[hidden]{display:none}
  .musica svg{width:22px;height:22px;fill:var(--noche)}
  .musica .i-pausa{display:none}
  .musica.sonando .i-play{display:none}
  .musica.sonando .i-pausa{display:block}
  .musica:focus-visible{outline:3px solid var(--luna);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){ .entrada b{animation:none} main{transform:none} }

  /* ===== puntero anime con brillitos ===== */
  html.puntero-on, html.puntero-on *{cursor:none !important}
  .puntero{position:fixed;left:0;top:0;z-index:100;width:14px;height:14px;margin:-6px 0 0 -6px;
    pointer-events:none;opacity:0;transition:opacity .15s}
  .puntero.visible{opacity:1}
  .puntero span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;
    box-shadow:0 0 0 1.5px rgba(20,16,43,.55),0 0 10px 2px rgba(255,255,255,.85);
    transition:transform .15s}
  .puntero.activo span{transform:scale(1.7)}
  .brillo{position:fixed;z-index:90;pointer-events:none;font-style:normal;line-height:1;
    text-shadow:0 0 8px currentColor,0 0 16px currentColor;
    transform:translate(-50%,-50%);animation:brillo .8s ease-out forwards}
  @keyframes brillo{
    0%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2) rotate(var(--r))}
  }

  /* ===== nombre escrito letra por letra ===== */
  h1{min-height:1.25em}
  h1.escribiendo::after{content:"|";margin-left:3px;text-shadow:none;animation:parpadeo .7s steps(1) infinite}
  @keyframes parpadeo{50%{opacity:0}}

  /* ===== footer dinámico ===== */
  footer{display:flex;justify-content:center;transform:translateZ(36px)}
  .pildora{position:relative;display:inline-block;padding:3px;border-radius:999px;overflow:hidden;isolation:isolate}
  .pildora::before{content:"";position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;
    background:conic-gradient(var(--sakura),var(--cielo),var(--luna),var(--sakura));
    animation:giro 4s linear infinite;z-index:-1}
  .onda{display:flex;padding:7px 20px;border-radius:999px;background:var(--noche);font-size:.95rem}
  .onda span{display:inline-block;font-weight:700;letter-spacing:.08em;color:var(--papel);
    animation:ola 1.8s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
  @keyframes ola{
    0%,55%,100%{transform:translateY(0);color:var(--papel);text-shadow:none}
    25%{transform:translateY(-5px);color:var(--sakura);text-shadow:0 0 10px var(--sakura)}
  }
  .musica.error{opacity:.5}
  @media (prefers-reduced-motion:reduce){ .pildora::before,.onda span,h1.escribiendo::after{animation:none} }

  /* ===== control de volumen ===== */
  .volbtn{right:calc(max(16px,env(safe-area-inset-right)) + 64px);box-shadow:4px 4px 0 var(--cielo)}
  .volbtn .v-on,.volbtn .v-off{fill:none;stroke:var(--noche);stroke-width:2;stroke-linecap:round}
  .volbtn .v-off{display:none}
  .volbtn.mudo .v-on{display:none}
  .volbtn.mudo .v-off{display:block}
  .volpanel{position:fixed;z-index:40;right:max(16px,env(safe-area-inset-right));
    bottom:calc(max(16px,env(safe-area-inset-bottom)) + 66px);display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:var(--papel);color:var(--noche);border:3px solid var(--noche);
    border-radius:14px 4px 14px 4px;box-shadow:4px 4px 0 var(--cielo)}
  .volpanel[hidden]{display:none}
  .volpanel input{width:150px;height:24px;accent-color:#ff5f9a}
  .volpanel output{min-width:3ch;text-align:right;font-weight:700;font-size:.85rem}

  /* ===== paleta nocturna unificada ===== */
  /* cielo nocturno: estrellas suaves y luna */
  .cielo-nocturno{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.72;background-image:radial-gradient(1px 1px at 8% 18%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 77% 14%,#c9d8ff 99%,transparent),radial-gradient(1px 1px at 60% 34%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 23% 42%,#d9e5ff 99%,transparent),radial-gradient(1px 1px at 91% 57%,#fff 99%,transparent),radial-gradient(1px 1px at 43% 9%,#fff 99%,transparent),radial-gradient(1.5px 1.5px at 13% 72%,#c9d8ff 99%,transparent),radial-gradient(1px 1px at 68% 81%,#fff 99%,transparent);background-size:300px 260px;animation:parpadeo-estrellas 5s ease-in-out infinite alternate}
  @keyframes parpadeo-estrellas{from{opacity:.42}to{opacity:.82}}
  .luna{position:fixed;top:9vh;right:12vw;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff9df,#f5d995 65%,#d6b774);box-shadow:0 0 28px 8px rgba(245,217,149,.18);opacity:.8}
  .escena{position:relative;z-index:1}
  .tema{position:fixed;z-index:60;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid rgba(190,210,240,.3);border-radius:999px;background:rgba(18,28,49,.92);color:#f3f6fb;font:700 .88rem "Zen Maru Gothic",system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.25);backdrop-filter:blur(10px);cursor:pointer;transition:background .2s ease,transform .2s ease,border-color .2s ease}
  .tema:hover{transform:translateY(-2px);border-color:var(--cielo)}
  .tema:focus-visible{outline:3px solid var(--luna);outline-offset:3px}
  .tema-icono{font-size:1.1rem;color:var(--luna);line-height:1}
  html[data-theme="day"] body{color:#192536;background:transparent}
  html[data-theme="day"] body::before{opacity:0}
  html[data-theme="day"] .cielo-nocturno{display:none}
  html[data-theme="day"] h1{text-shadow:3px 3px 0 rgba(255,125,156,.55)}
  html[data-theme="day"] .bio{color:#34445a;text-shadow:none}
  html[data-theme="day"] .kanji{color:#187b83;text-shadow:none}
  html[data-theme="day"] .links a{color:#1d2b3d;background:rgba(255,255,255,.88);box-shadow:5px 5px 0 color-mix(in srgb,var(--c,var(--sakura)) 55%,transparent)}
  html[data-theme="day"] .links a:hover,html[data-theme="day"] .links a:focus-visible{background:#fff}
  html[data-theme="day"] .links .ico{background:color-mix(in srgb,var(--c,var(--sakura)) 17%,white);border-color:rgba(29,43,61,.12)}
  html[data-theme="day"] .links .ico svg{fill:#25354a}
  html[data-theme="day"] .txt small{color:#56677c}
  html[data-theme="day"] footer{color:#56677c}
  html[data-theme="day"] .onda{background:#fff;color:#24344a}
  html[data-theme="day"] .onda span{color:#24344a}
  html[data-theme="day"] .tema{background:rgba(255,255,255,.9);color:#24344a;border-color:rgba(36,52,74,.18)}
  html[data-theme="day"] .tema-icono{color:#d78a14}
  @media(prefers-reduced-motion:reduce){.cielo-nocturno{animation:none}.tema{transition:none}}
  .links a{color:var(--papel);background:rgba(24,36,56,.94);border-color:var(--c,var(--sakura));box-shadow:5px 5px 0 color-mix(in srgb,var(--c,var(--sakura)) 72%,transparent)}
  .links a:hover,.links a:focus-visible{background:#293c58}
  .links a:focus-visible{outline-color:var(--luna)}
  .links .ico{border-color:rgba(243,246,251,.16);background:color-mix(in srgb,var(--c,var(--sakura)) 24%,#182438)}
  .links .ico svg{fill:var(--c,var(--sakura))}
  .txt small{color:#c2cede;opacity:1}
  .petalo{opacity:.58}
  .bio{color:#dce5f1;text-shadow:0 1px 8px rgba(7,13,24,.8)}
  .kanji{color:var(--cielo);text-shadow:0 0 16px rgba(103,216,207,.28)}
  footer{color:#b9c7d9}
  .musica{background:#202f49;border-color:var(--sakura);box-shadow:4px 4px 0 rgba(255,125,156,.46)}
  .musica svg{fill:var(--papel)}
  .volbtn{border-color:var(--cielo);box-shadow:4px 4px 0 rgba(103,216,207,.42);background:#202f49}
  .volbtn .v-on,.volbtn .v-off{fill:none;stroke:var(--papel)}
  .volpanel{background:#202f49;color:var(--papel);border-color:var(--cielo);box-shadow:4px 4px 0 rgba(103,216,207,.35)}
  .volpanel input{accent-color:var(--cielo)}
  .musica:focus-visible,.volbtn:focus-visible{outline:3px solid var(--luna);outline-offset:4px}
  /* fondos día y noche con cruce rápido y desenfoque */
  body{background:transparent;color:var(--papel);font-family:"Space Grotesk",system-ui,sans-serif}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(7,12,18,.22),rgba(5,10,16,.72));transition:background .3s ease}
  .fondo{position:fixed;inset:-8px;z-index:-2;background-position:center;background-size:cover;background-repeat:no-repeat;opacity:0;filter:blur(8px);transform:scale(1.025);transition:opacity .32s ease,filter .32s ease,transform .42s ease;will-change:opacity,filter}
  .fondo-dia{background-image:url("Dia_alineado.png")}
  .fondo-noche{background-image:url("Noche_alineada.png")}
  html[data-theme="night"] .fondo-noche,html:not([data-theme="day"]) .fondo-noche{opacity:1;filter:blur(0);transform:scale(1)}
  html[data-theme="day"] .fondo-dia{opacity:1;filter:blur(0);transform:scale(1)}
  html.cambiando-fondo .fondo{filter:blur(10px);transform:scale(1.04)}
  html[data-theme="day"] body::before{opacity:1;background:linear-gradient(180deg,rgba(8,15,22,.08),rgba(8,15,22,.5))}

  /* interfaz sobria, geométrica y de alto contraste */
  h1{font-family:"Barlow Condensed","Space Grotesk",sans-serif;font-size:clamp(3rem,10vw,4.4rem);letter-spacing:.045em;text-shadow:0 5px 26px rgba(0,0,0,.55);transform:translateZ(44px)}
  .kanji{font-family:"Space Grotesk",sans-serif;color:#8bb8c1;letter-spacing:.22em;text-shadow:none}
  .bio{color:#e1e7eb;text-shadow:0 2px 12px rgba(0,0,0,.72);font-size:.98rem}
  .avatar{width:116px;height:116px;margin-bottom:22px}
  .avatar::before{background:conic-gradient(var(--sakura),#334b5b,var(--cielo),var(--sakura));animation-duration:14s}
  .avatar::after{background:#0b1118}
  .links{gap:11px}
  .links a{color:#f1f4f6;background:rgba(10,17,24,.86);border:1px solid rgba(219,230,238,.18);border-left:3px solid var(--c,var(--sakura));border-radius:8px;padding:13px 15px;box-shadow:0 8px 24px rgba(0,0,0,.2);backdrop-filter:blur(12px);transition:transform .18s ease,background .18s ease,border-color .18s ease}
  .links a:hover,.links a:focus-visible{transform:translateY(-2px);background:rgba(18,29,39,.96);box-shadow:0 12px 28px rgba(0,0,0,.3)}
  .links a:focus-visible{outline:2px solid var(--luna);outline-offset:3px}
  .links .ico{width:42px;height:42px;background:transparent;border:1px solid color-mix(in srgb,var(--c,var(--sakura)) 50%,transparent);border-radius:8px}
  .links .ico svg{fill:var(--c,var(--sakura))}
  .txt b{font-family:"Space Grotesk",sans-serif;font-size:1rem;font-weight:600;letter-spacing:.01em}
  .txt small{color:#c0cbd2;opacity:.9;font-size:.8rem}
  footer{color:#d0d8de;font-family:"Space Grotesk",sans-serif;letter-spacing:.04em}
  .pildora{padding:1px;background:rgba(220,232,238,.22)}
  .pildora::before{display:none}
  .onda{background:rgba(10,17,24,.88);border:1px solid rgba(220,232,238,.16);padding:7px 18px}
  .onda span{color:#e1e8ed;animation:none}
  .onda span:first-child{color:var(--sakura)}
  .entrada{background:rgba(5,10,15,.9);backdrop-filter:blur(14px)}
  .entrada .k{font-family:"Barlow Condensed",sans-serif;color:#e8b45e;text-shadow:none;font-size:3.6rem}
  .entrada b{font-family:"Space Grotesk",sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:#d6e0e5}
  .musica,.volpanel{background:rgba(10,17,24,.95);border-color:rgba(220,232,238,.24);box-shadow:0 8px 26px rgba(0,0,0,.35);backdrop-filter:blur(12px)}
  .musica svg,.volbtn .v-on,.volbtn .v-off{fill:#e8b45e;stroke:#e8b45e}
  .volpanel{color:#edf1f4}
  .tema{top:max(18px,env(safe-area-inset-top));right:max(18px,env(safe-area-inset-right));padding:10px 15px;border:1px solid rgba(223,233,239,.24);border-radius:7px;background:rgba(9,16,23,.88);color:#edf1f4;font:600 .78rem "Space Grotesk",sans-serif;letter-spacing:.09em;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.28);backdrop-filter:blur(12px)}
  .tema:hover{transform:translateY(-1px);border-color:var(--sakura)}
  .tema-icono{color:#e8b45e}
html[data-theme="day"] .links a{color:#182633;background:rgba(242,247,250,.86);border-color:rgba(20,36,48,.2);border-left:3px solid var(--c,var(--sakura));box-shadow:0 8px 24px rgba(8,21,30,.16)}
  html[data-theme="day"] .links a:hover,html[data-theme="day"] .links a:focus-visible{background:rgba(255,255,255,.96)}
  html[data-theme="day"] .links .ico{background:rgba(20,36,48,.05);border-color:rgba(20,36,48,.16)}
  html[data-theme="day"] .links .ico svg{fill:#263b4a}
  html[data-theme="day"] .txt small{color:#4c606e}
  html[data-theme="day"] .bio{color:#f2f5f6}
  html[data-theme="day"] .kanji{color:#d9e7e9}
  html[data-theme="day"] .onda{background:rgba(11,22,31,.84)}
  html[data-theme="day"] footer{color:#f0f4f5}
  html[data-theme="day"] .tema{background:rgba(242,247,250,.9);color:#1a2a36;border-color:rgba(20,36,48,.22)}
  @media(prefers-reduced-motion:reduce){.fondo,.tema,.links a{transition:none}.avatar::before{animation:none}}
  /* destellos flotantes y cursor luminoso */
  #petalos{display:block;z-index:2}
  .petalo{display:block;background:transparent;border-radius:0;width:12px;height:12px;opacity:.78}
  .petalo::before{content:"✦";position:absolute;inset:-2px;color:#e8b45e;font-size:12px;text-shadow:0 0 7px rgba(232,180,94,.9),0 0 16px rgba(101,182,196,.5)}
  .puntero{display:block;width:15px;height:15px;margin:-7px 0 0 -7px;z-index:100;opacity:0}
  .puntero span{background:radial-gradient(circle,#f8f4e8 0 18%,#e8b45e 32%,rgba(101,182,196,.75) 56%,transparent 75%);box-shadow:0 0 0 1px rgba(235,242,245,.48),0 0 13px 5px rgba(232,180,94,.52),0 0 27px 9px rgba(101,182,196,.28);transition:transform .15s,box-shadow .15s}
  .puntero.activo span{box-shadow:0 0 0 1px rgba(235,242,245,.65),0 0 17px 7px rgba(232,180,94,.72),0 0 34px 12px rgba(101,182,196,.4)}

    const w = foto.naturalWidth, h = foto.naturalHeight;
    if (!w || !h) return;
    ctx.clearRect(0, 0, 64, 64);
    ctx.fillStyle = "#0a1018";
    ctx.beginPath(); ctx.arc(32, 32, 31, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(32, 32, 25, 0, Math.PI * 2); ctx.clip();
    const lado = Math.min(w, h);
    ctx.drawImage(foto, (w - lado) / 2, (h - lado) / 2, lado, lado, 7, 7, 50, 50);
    ctx.restore();
    ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI * 2);
    ctx.strokeStyle = "#344856"; ctx.lineWidth = 3; ctx.stroke();
    const angulo = reducir ? -Math.PI / 2 : tiempo / 900;
    ctx.beginPath(); ctx.arc(32, 32, 28, angulo, angulo + .82);
    ctx.strokeStyle = "#e8b45e"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.stroke();
    const x = 32 + Math.cos(angulo + .82) * 28, y = 32 + Math.sin(angulo + .82) * 28;
    ctx.beginPath(); ctx.arc(x, y, 3.2, 0, Math.PI * 2);
    ctx.fillStyle = "#65b6c4"; ctx.shadowColor = "#65b6c4"; ctx.shadowBlur = 7; ctx.fill(); ctx.shadowBlur = 0;
    const paso = Math.floor(tiempo / 180) % (nombre.length + 5);
    const visibles = reducir ? nombre.length : (paso <= nombre.length ? paso : 0);
    const escrito = nombre.slice(0, visibles);
    ctx.fillStyle = "rgba(5,10,16,.92)";
    ctx.fillRect(7, 43, 50, 14);
    ctx.fillStyle = "#e8b45e";
    ctx.font = "bold 9px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(escrito + (visibles < nombre.length ? "▍" : ""), 32, 50, 48);    icono.href = canvas.toDataURL("image/png");
    icono.type = "image/png";
  };
  const iniciar = () => {
    if (reducir) { pintar(0); return; }
    const ciclo = ahora => { if (ahora - ultimo > 140) { pintar(ahora); ultimo = ahora; } requestAnimationFrame(ciclo); };
    requestAnimationFrame(ciclo);
  };
  if (foto.complete && foto.naturalWidth) iniciar();
  else foto.addEventListener("load", iniciar, { once:true });
})();

/* efecto 3D: mouse (PC) o giroscopio (celular) */
(() => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const root = document.documentElement, lim = v => Math.max(-1, Math.min(1, v));
  let tx = 0, ty = 0, cx = 0, cy = 0;
  addEventListener("pointermove", e => { tx = lim(e.clientX / innerWidth * 2 - 1); ty = lim(e.clientY / innerHeight * 2 - 1); });
  addEventListener("deviceorientation", e => { if (e.gamma == null) return; tx = lim(e.gamma / 25); ty = lim((e.beta - 50) / 25); });
  (function frame() {
    cx += (tx - cx) * .08; cy += (ty - cy) * .08;
    root.style.setProperty("--ry", (cx * 11).toFixed(2) + "deg");
    root.style.setProperty("--rx", (-cy * 9).toFixed(2) + "deg");
    root.style.setProperty("--bx", (-cx * 16).toFixed(1) + "px");
    root.style.setProperty("--by", (-cy * 16).toFixed(1) + "px");
    requestAnimationFrame(frame);
  })();
})();

/* música: empieza al tocar "entrar" (los navegadores no dejan sonar solos) */
(() => {
  const entrada = $("entrada"), btn = $("musica");
  const dato = typeof MUSICA_DATA !== "undefined" ? MUSICA_DATA : "";
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!MUSICA && !dato) { entrada.remove(); btn.remove(); document.dispatchEvent(new Event("entrar")); return; }

  let r, pidio = false, nivel = 0.5;
  const cambio = () => {
    btn.classList.toggle("sonando", r.sonando());
    btn.setAttribute("aria-label", r.sonando() ? "Pausar música" : "Activar música");
  };
  const fallo = () => btn.classList.add("error");

  /* plan B: decodifica el MP3 incrustado con Web Audio (sirve aunque el navegador o la vista previa bloqueen <audio>) */
  const web = () => {
    const ctx = new AC(), vol = ctx.createGain();
    vol.gain.value = nivel; vol.connect(ctx.destination);
    let buf = null, fuente = null, quiere = false;
    const arrancar = () => {
      if (!buf || fuente) return;
      fuente = ctx.createBufferSource();
      fuente.buffer = buf; fuente.loop = true; fuente.connect(vol); fuente.start(0);
    };
    const bin = atob(dato.split(",")[1]), bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    new Promise((ok, mal) => ctx.decodeAudioData(bytes.buffer, ok, mal))
      .then(b => { buf = b; if (quiere) arrancar(); }).catch(fallo);
    ctx.onstatechange = cambio;
    return {
      web: true,
      vol: v => { vol.gain.value = v; },
      sonando: () => quiere && ctx.state === "running",
      play: () => { quiere = true; ctx.resume().catch(() => {}); arrancar(); },
      pause: () => { quiere = false; ctx.suspend().catch(() => {}); cambio(); }
    };
  };
  const pasarAWeb = () => {
    if (!dato || !AC || (r && r.web)) return false;
    r = web(); if (pidio) r.play(); cambio(); mostrarVol(); return true;
  };

  /* plan A: <audio> normal (suena aunque el iPhone esté en silencio) */
  const html = () => {
    const audio = new Audio(dato || MUSICA);
    audio.loop = true; audio.volume = nivel; audio.preload = "auto";
    audio.addEventListener("play", cambio);
    audio.addEventListener("pause", cambio);
    audio.addEventListener("error", () => { if (!pasarAWeb()) fallo(); });
    return {
      vol: v => { audio.volume = v; },
      sonando: () => !audio.paused,
      play: () => audio.play().catch(e => { if (e && e.name === "NotSupportedError" && !pasarAWeb()) fallo(); }),
      pause: () => audio.pause()
    };
  };
  r = html();

  /* volumen: el iPhone no deja cambiar el volumen desde la página; ahí se usan los botones del celular */
  const vbtn = $("volbtn"), panel = $("volpanel"), rango = $("volrango"), num = $("volnum");
  const volOK = (() => { const a = new Audio(); a.volume = .5; return a.volume === .5; })();
  const mostrarVol = () => { vbtn.hidden = btn.hidden || !(r.web || volOK); if (vbtn.hidden) panel.hidden = true; };
  const pintarVol = () => {
    num.textContent = Math.round(nivel * 100) + "%";
    rango.value = Math.round(nivel * 100);
    vbtn.classList.toggle("mudo", nivel === 0);
  };
  const cerrarVol = () => { panel.hidden = true; vbtn.setAttribute("aria-expanded", "false"); };
  rango.addEventListener("input", () => { nivel = rango.value / 100; r.vol(nivel); pintarVol(); });
  vbtn.addEventListener("click", () => { panel.hidden = !panel.hidden; vbtn.setAttribute("aria-expanded", String(!panel.hidden)); });
  document.addEventListener("pointerdown", e => { if (!panel.hidden && !panel.contains(e.target) && !vbtn.contains(e.target)) cerrarVol(); });

  const tocar = () => { pidio = true; r.play(); };
  entrada.addEventListener("click", () => {
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function") {
      DeviceOrientationEvent.requestPermission().catch(() => {});             // iPhone pide permiso para el giroscopio
    }
    tocar();
    btn.hidden = false;
    mostrarVol();
    entrada.classList.add("fuera");
    document.dispatchEvent(new Event("entrar"));
    setTimeout(() => entrada.remove(), 500);
  });
  btn.addEventListener("click", () => { if (r.sonando()) { pidio = false; r.pause(); } else tocar(); });
})();

/* puntero anime con brillitos */
(() => {
  const root = document.documentElement, cur = $("puntero");
  const fino = matchMedia("(pointer: fine)").matches;
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const COLORES = ["#e2a84e", "#65b6c4", "#8ba6b8", "#ffffff"], FORMAS = ["✦", "✧", "✦", "·"];
  let lx = -99, ly = -99, vivos = 0;
  if (fino) root.classList.add("puntero-on"); else cur.remove();

  const brillo = (x, y, spread = 10) => {
    if (quieto || vivos > 70) return;
    const b = document.createElement("i");
    b.className = "brillo";
    b.textContent = FORMAS[Math.random() * FORMAS.length | 0];
    b.style.cssText =
      `left:${x + (Math.random() - .5) * spread}px;top:${y + (Math.random() - .5) * spread}px;` +
      `font-size:${9 + Math.random() * 13}px;color:${COLORES[Math.random() * COLORES.length | 0]};` +
      `--dx:${(Math.random() - .5) * 46}px;--dy:${14 + Math.random() * 34}px;--r:${(Math.random() - .5) * 160}deg;` +
      `animation-duration:${.6 + Math.random() * .6}s`;
    b.addEventListener("animationend", () => { b.remove(); vivos--; });
    document.body.appendChild(b); vivos++;
  };

  addEventListener("pointermove", e => {
    if (fino && e.pointerType === "mouse") {
      cur.style.transform = `translate(${e.clientX - 1}px,${e.clientY - 1}px)`;
      cur.classList.add("visible");
      cur.classList.toggle("activo", !!(e.target.closest && e.target.closest("a,button,input,.entrada")));
    }
    if (Math.hypot(e.clientX - lx, e.clientY - ly) > 12) { lx = e.clientX; ly = e.clientY; brillo(lx, ly); }
  });
  addEventListener("pointerdown", e => { for (let i = 0; i < 9; i++) brillo(e.clientX, e.clientY, 30); });
  root.addEventListener("mouseleave", () => cur.classList.remove("visible"));
})();
</script>
